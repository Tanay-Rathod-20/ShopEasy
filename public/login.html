<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ShopEasy - Login / Register</title>
    <link rel="stylesheet" href="/css/style.css">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🛍️</text></svg>">
</head>
<body>
    <!-- Top Navigation Bar -->
    <header>
        <nav class="navbar">
            <a href="/" class="brand">
                <span class="brand-icon">🛍️</span>
                <span>ShopEasy</span>
            </a>
            <ul class="nav-links">
                <li><a href="/" class="nav-link">Home</a></li>
                <li><a href="/#catalogue" class="nav-link">Shop</a></li>
                <span id="nav-auth-container" class="nav-auth-group">
                    <li><a href="/login.html" class="nav-link active">Login</a></li>
                </span>
                <li>
                    <a href="/cart.html" class="cart-link" title="View Shopping Cart">
                        <span>🛒 Cart</span>
                        <span class="cart-badge" id="cart-count">0</span>
                    </a>
                </li>
            </ul>
        </nav>
    </header>

    <main>
        <div class="auth-wrapper">
            <!-- Tabs: Login vs Register -->
            <div class="auth-tabs">
                <button type="button" class="auth-tab active" id="tab-login">Sign In</button>
                <button type="button" class="auth-tab" id="tab-register">Create Account</button>
            </div>

            <div class="auth-body">
                <!-- Feedback Alert Box -->
                <div id="auth-alert" class="form-alert"></div>

                <!-- 1. LOGIN FORM -->
                <form id="form-login">
                    <div class="form-group">
                        <label for="login-email" class="form-label">Email Address</label>
                        <input type="email" id="login-email" class="form-input" placeholder="you@example.com" required autocomplete="email">
                    </div>
                    <div class="form-group">
                        <label for="login-password" class="form-label">Password</label>
                        <input type="password" id="login-password" class="form-input" placeholder="••••••••" required autocomplete="current-password">
                    </div>
                    <button type="submit" class="btn-primary" id="btn-login-submit">Sign In</button>
                </form>

                <!-- 2. REGISTER FORM -->
                <form id="form-register" style="display: none;">
                    <div class="form-group">
                        <label for="reg-name" class="form-label">Full Name</label>
                        <input type="text" id="reg-name" class="form-input" placeholder="Jane Doe" required minlength="2" autocomplete="name">
                    </div>
                    <div class="form-group">
                        <label for="reg-email" class="form-label">Email Address</label>
                        <input type="email" id="reg-email" class="form-input" placeholder="you@example.com" required autocomplete="email">
                    </div>
                    <div class="form-group">
                        <label for="reg-password" class="form-label">Password (Min 6 characters)</label>
                        <input type="password" id="reg-password" class="form-input" placeholder="••••••••" required minlength="6" autocomplete="new-password">
                    </div>
                    <button type="submit" class="btn-primary" id="btn-register-submit">Create Account</button>
                </form>
            </div>
        </div>
    </main>

    <footer>
        <p>&copy; 2026 ShopEasy E-Commerce Store. All rights reserved.</p>
    </footer>

    <!-- Shared Modules -->
    <script src="/js/api.js"></script>
    <script src="/js/auth.js"></script>
    <script src="/js/cart.js"></script>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // If already logged in, redirect home
            if (auth.isLoggedIn()) {
                window.location.href = '/';
                return;
            }

            const tabLogin = document.getElementById('tab-login');
            const tabRegister = document.getElementById('tab-register');
            const formLogin = document.getElementById('form-login');
            const formRegister = document.getElementById('form-register');
            const authAlert = document.getElementById('auth-alert');

            // Switch to Register if URL hash is #register
            if (window.location.hash === '#register') {
                activateRegisterTab();
            }

            function showAlert(msg, isSuccess = false) {
                authAlert.textContent = msg;
                authAlert.className = `form-alert ${isSuccess ? 'form-alert-success' : 'form-alert-error'}`;
                authAlert.style.display = 'block';
            }

            function clearAlert() {
                authAlert.style.display = 'none';
                authAlert.textContent = '';
            }

            function activateLoginTab() {
                tabLogin.classList.add('active');
                tabRegister.classList.remove('active');
                formLogin.style.display = 'block';
                formRegister.style.display = 'none';
                clearAlert();
            }

            function activateRegisterTab() {
                tabRegister.classList.add('active');
                tabLogin.classList.remove('active');
                formRegister.style.display = 'block';
                formLogin.style.display = 'none';
                clearAlert();
            }

            tabLogin.addEventListener('click', activateLoginTab);
            tabRegister.addEventListener('click', activateRegisterTab);

            // Handle Login
            formLogin.addEventListener('submit', async (e) => {
                e.preventDefault();
                clearAlert();

                const email = document.getElementById('login-email').value.trim();
                const password = document.getElementById('login-password').value;
                const submitBtn = document.getElementById('btn-login-submit');

                submitBtn.disabled = true;
                submitBtn.textContent = 'Signing in...';

                try {
                    const res = await api.login(email, password);
                    if (res.success) {
                        showAlert('Login successful! Redirecting...', true);
                        auth.setSession(res.token, res.user);

                        // Check for redirect query param
                        const params = new URLSearchParams(window.location.search);
                        const redirectUrl = params.get('redirect') || '/';
                        setTimeout(() => {
                            window.location.href = redirectUrl;
                        }, 700);
                    }
                } catch (err) {
                    showAlert(err.message || 'Login failed. Please check your credentials.');
                    submitBtn.disabled = false;
                    submitBtn.textContent = 'Sign In';
                }
            });

            // Handle Registration
            formRegister.addEventListener('submit', async (e) => {
                e.preventDefault();
                clearAlert();

                const name = document.getElementById('reg-name').value.trim();
                const email = document.getElementById('reg-email').value.trim();
                const password = document.getElementById('reg-password').value;
                const submitBtn = document.getElementById('btn-register-submit');

                if (name.length < 2) {
                    showAlert('Please enter your full name (at least 2 characters).');
                    return;
                }
                if (password.length < 6) {
                    showAlert('Password must be at least 6 characters long.');
                    return;
                }

                submitBtn.disabled = true;
                submitBtn.textContent = 'Creating Account...';

                try {
                    const res = await api.register(name, email, password);
                    if (res.success) {
                        showAlert('Account created successfully! Redirecting...', true);
                        auth.setSession(res.token, res.user);
                        setTimeout(() => {
                            window.location.href = '/';
                        }, 800);
                    }
                } catch (err) {
                    showAlert(err.message || 'Registration failed.');
                    submitBtn.disabled = false;
                    submitBtn.textContent = 'Create Account';
                }
            });
        });
    </script>
</body>
</html>
